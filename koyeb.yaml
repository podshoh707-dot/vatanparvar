name: avtomaktab-bot
type: worker
definition:
  build:
    type: buildpack
    buildpack:
      build_command: pip install -r requirements.txt
      run_command: python bot.py
  instance_types:
    - type: nano
  scalings:
    - min: 1
      max: 1
  regions:
    - fra
  env:
    - key: PYTHONUNBUFFERED
      value: "1"
    - key: WEBAPP_URL
      value: "https://avtomaktab-webapp.vercel.app/"
