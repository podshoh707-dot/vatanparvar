services:
  - type: web
    name: avtovatanparvar-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPERADMIN_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL_ID
        value: "@AvtoVatanparvar_testlari"
      - key: CHANNEL_USERNAME
        value: "@AvtoVatanparvar_testlari"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TIMEZONE
        value: "Asia/Tashkent"
